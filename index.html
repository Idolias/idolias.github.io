<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fishing Pool Probability Studio</title>
<style>
:root{
  --bg:#0f1512; --panel:#16201b; --panel2:#1c2920; --line:#2a3a31;
  --text:#eaf2ec; --muted:#9ab3a2; --accent:#5fd0a0; --accent2:#e8a254;
  --unboost:#4fa3ff; --unboost-bg:#152948; --surge:#e26fe8; --surge-bg:#3b1646;
  --bad:#c75c5c; --radius:6px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f8f6; --panel:#ffffff; --panel2:#eef3ef; --line:#d8e2db;
    --text:#13201a; --muted:#51695c; --accent:#1f9d6b; --accent2:#b9701f;
    --unboost:#1d6fdb; --unboost-bg:#dbe9fb; --surge:#a721b5; --surge-bg:#f6def9;
    color-scheme: light;
  }
}
:root[data-theme="light"]{
  --bg:#f6f8f6; --panel:#ffffff; --panel2:#eef3ef; --line:#d8e2db;
  --text:#13201a; --muted:#51695c; --accent:#1f9d6b; --accent2:#b9701f;
  --unboost:#1d6fdb; --unboost-bg:#dbe9fb; --surge:#a721b5; --surge-bg:#f6def9;
  --bad:#c75c5c; --radius:6px;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#0f1512; --panel:#16201b; --panel2:#1c2920; --line:#2a3a31;
  --text:#eaf2ec; --muted:#9ab3a2; --accent:#5fd0a0; --accent2:#e8a254;
  --unboost:#4fa3ff; --unboost-bg:#152948; --surge:#e26fe8; --surge-bg:#3b1646;
  --bad:#c75c5c; --radius:6px;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Iowan Old Style',Georgia,serif; font-size:14px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3{font-family:Georgia,serif; font-weight:600; margin:0 0 .3em;}
.app{max-width:1400px;margin:0 auto;padding:20px 20px 60px;}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
header h1{font-size:1.5rem; color:var(--accent);}
.tag{color:var(--muted); font-size:.85rem;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px;}
.tab{padding:7px 14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--text);font-size:.85rem;}
.tab.active{background:var(--accent);color:#06130c;border-color:var(--accent);font-weight:600;}
.iconbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:var(--radius);padding:6px 10px;cursor:pointer;font-size:.8rem;}
.iconbtn:hover{color:var(--text);border-color:var(--accent);}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px;}
button.primary{background:var(--accent);color:#06130c;border:none;border-radius:var(--radius);padding:8px 14px;font-weight:600;cursor:pointer;}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:var(--radius);padding:8px 14px;cursor:pointer;}
button.danger{border-color:var(--bad);color:var(--bad);}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:5px 7px;font-family:inherit;font-size:.85rem;}
input[type=number]{width:70px;}
table{border-collapse:collapse;width:100%;font-size:.82rem;}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;}
th{text-align:center;position:sticky;top:0;background:var(--panel);font-weight:600;}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1;}
.matrixwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
.grp-base th{background:var(--panel2);}
.grp-unboost th{background:var(--unboost-bg);color:var(--unboost);}
.grp-surge th{background:var(--surge-bg);color:var(--surge);}
.cell-unboost{background:color-mix(in srgb, var(--unboost-bg) 55%, transparent);}
.cell-surge{background:color-mix(in srgb, var(--surge-bg) 55%, transparent);}
.selected-row td{outline:2px solid var(--accent2); outline-offset:-2px;}
.status{color:var(--muted);font-style:italic;font-size:.75rem;}
.badge{display:inline-block;font-size:.65rem;padding:1px 6px;border-radius:10px;margin-left:4px;}
.badge.bait{background:var(--accent2);color:#2b1700;}
.badge.hook{background:var(--accent);color:#06130c;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:8px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:800px){.grid2{grid-template-columns:1fr;}}
.bar-row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.78rem;}
.bar-label{width:110px;flex:0 0 110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;background:var(--panel2);border-radius:3px;height:14px;position:relative;}
.bar-fill{height:100%;border-radius:3px;}
.diverge-track{flex:1;background:var(--panel2);height:14px;position:relative;border-radius:3px;}
.diverge-zero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted);}
.diverge-fill{position:absolute;top:0;bottom:0;border-radius:3px;}
.small{font-size:.75rem;color:var(--muted);}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.82rem;}
.detail dt{color:var(--muted);}
.presentation .edit-only{display:none !important;}
footer{margin-top:20px;color:var(--muted);font-size:.72rem;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
"use strict";

// ---------- Data model & defaults ----------
const uid = (p)=>p+'_'+Math.random().toString(36).slice(2,9);

function defaultSettings(){
  return {
    surgeEnabled:true, surgeMults:[5,4,3,2],
    baitEnabled:true, baitMult:3, maxBaitTargets:1, baitTargets:[],
    hookEnabled:true, hookMult:1.5, hookTarget:null
  };
}
function sampleFish(){
  return [
    {id:uid('f'),name:'Golden Koi',rarityRank:1,baseWeight:6,baitEligible:true},
    {id:uid('f'),name:'Silver Marlin',rarityRank:2,baseWeight:8,baitEligible:true},
    {id:uid('f'),name:'Jade Eel',rarityRank:3,baseWeight:14,baitEligible:true},
    {id:uid('f'),name:'Copper Trout',rarityRank:4,baseWeight:20,baitEligible:false},
    {id:uid('f'),name:'Common Perch',rarityRank:5,baseWeight:52,baitEligible:false},
    {id:uid('f'),name:'River Carp',rarityRank:6,baseWeight:60,baitEligible:false},
  ];
}
function newPool(name){
  const fish = sampleFish();
  const settings = defaultSettings();
  const p = {id:uid('p'), name, fish, settings};
  p.initial = JSON.parse(JSON.stringify({fish, settings}));
  return p;
}

let state = load() || {pools:[newPool('Sample Lake')], activePoolId:null, presentation:false, selectedFishId:null, chartSurge:false, chartMode:'side'};
if(!state.activePoolId) state.activePoolId = state.pools[0].id;

function save(){ try{ localStorage.setItem('fishing_app_state_v1', JSON.stringify(state)); }catch(e){} }
function load(){ try{ const r = localStorage.getItem('fishing_app_state_v1'); return r?JSON.parse(r):null; }catch(e){ return null; } }

function activePool(){ return state.pools.find(p=>p.id===state.activePoolId); }

// ---------- Rarity rank helpers ----------
function reorderFish(pool, draggedId, targetId){
  let order = orderedFish(pool).map(f=>f.id);
  order = order.filter(id=>id!==draggedId);
  const idx = order.indexOf(targetId);
  order.splice(idx, 0, draggedId);
  order.forEach((id,i)=>{ pool.fish.find(x=>x.id===id).rarityRank = i+1; });
}
function normalizeRanks(pool){
  // close gaps, keep relative order, unranked (null) go to end in current order
  const ranked = pool.fish.filter(f=>f.rarityRank!=null).sort((a,b)=>a.rarityRank-b.rarityRank);
  const unranked = pool.fish.filter(f=>f.rarityRank==null);
  let r=1;
  ranked.forEach(f=>{ f.rarityRank=r++; });
  unranked.forEach(f=>{ f.rarityRank=r++; });
}
function orderedFish(pool){
  return [...pool.fish].sort((a,b)=>(a.rarityRank??999)-(b.rarityRank??999));
}
function surgeMultFor(f, settings){
  if(!settings.surgeEnabled) return 1;
  const r = f.rarityRank;
  if(r>=1 && r<=settings.surgeMults.length) return settings.surgeMults[r-1];
  return 1;
}

// ---------- Scenario calculation engine ----------
const SCENARIOS = [
  {key:'unboosted', label:'Unboosted', surge:false, bait:false, hook:false, grp:'unboost', desc:'No modifiers applied. Identical to the Probability column.'},
  {key:'baitU', label:'Bait Unboosted', surge:false, bait:true, hook:false, grp:'unboost', desc:'Fishing Bait only. Surge and Hook are inactive.'},
  {key:'hookU', label:'Hook Unboosted', surge:false, bait:false, hook:true, grp:'unboost', desc:'Fishing Hook only. Surge and Bait are inactive.'},
  {key:'baitHookU', label:'Bait + Hook Unboosted', surge:false, bait:true, hook:true, grp:'unboost', desc:'Fishing Bait and Fishing Hook together. Surge is inactive.'},
  {key:'surge', label:'Surge', surge:true, bait:false, hook:false, grp:'surge', desc:'Fishing Surge only, applied by each fish\u2019s persistent rarity rank.'},
  {key:'surgeBait', label:'Surge + Bait', surge:true, bait:true, hook:false, grp:'surge', desc:'Fishing Surge and Fishing Bait together. Hook is inactive.'},
  {key:'surgeHook', label:'Surge + Hook', surge:true, bait:false, hook:true, grp:'surge', desc:'Fishing Surge and Fishing Hook together. Bait is inactive.'},
  {key:'surgeBaitHook', label:'Surge + Hook + Bait', surge:true, bait:true, hook:true, grp:'surge', desc:'All three modifiers active together \u2014 the maximum boost.'},
];

function computeScenario(pool, opts){
  const {surge, bait, hook} = opts;
  const s = pool.settings;
  const rows = pool.fish.map(f=>{
    let sMult=1,bMult=1,hMult=1, baitStatus=null, hookStatus=null;
    if(surge) sMult = surgeMultFor(f,s);
    if(bait && s.baitEnabled){
      if(f.baitEligible && s.baitTargets.includes(f.id)) bMult = s.baitMult;
      else baitStatus = 'No Bait';
    } else if(bait && !s.baitEnabled){ baitStatus='Bait Off'; }
    if(hook && s.hookEnabled){
      if(s.hookTarget===f.id) hMult = s.hookMult;
      else hookStatus = 'No Hook';
    } else if(hook && !s.hookEnabled){ hookStatus='Hook Off'; }
    const modWeight = f.baseWeight * sMult * bMult * hMult;
    return {fish:f, modWeight, sMult, bMult, hMult, baitStatus, hookStatus};
  });
  const total = rows.reduce((a,r)=>a+r.modWeight,0);
  rows.forEach(r=>{ r.prob = total>0 ? r.modWeight/total : 0; });
  return {rows, total};
}
function activeScenarioKey(pool){
  const s = pool.settings;
  const baitActive = s.baitEnabled && s.baitTargets.length>0;
  const hookActive = s.hookEnabled && s.hookTarget!=null;
  if(state.chartSurge){
    if(baitActive && hookActive) return 'surgeBaitHook';
    if(baitActive) return 'surgeBait';
    if(hookActive) return 'surgeHook';
    return 'surge';
  }
  if(baitActive && hookActive) return 'baitHookU';
  if(baitActive) return 'baitU';
  if(hookActive) return 'hookU';
  return 'unboosted';
}
function baseProbs(pool){
  const total = pool.fish.reduce((a,f)=>a+f.baseWeight,0);
  const map = {};
  pool.fish.forEach(f=> map[f.id] = total>0 ? f.baseWeight/total : 0);
  return {map, total};
}
function allScenarios(pool){
  const out = {};
  SCENARIOS.forEach(sc=>{ out[sc.key] = computeScenario(pool, sc); });
  return out;
}
const pct = (x)=> (x*100).toFixed(2)+'%';

// ---------- Rendering ----------
const $ = (sel,el)=> (el||document).querySelector(sel);
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){
    if(k==='class') e.className=attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k==='checked' || k==='selected' || k==='disabled') e[k] = !!attrs[k];
    else if(k==='value') e.value = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(k=>{ if(k==null) return; e.appendChild(typeof k==='string'?document.createTextNode(k):k); });
  return e;
}

function render(){
  const root = $('#app');
  root.innerHTML='';
  const pool = activePool();
  root.className = state.presentation ? 'presentation' : '';

  // header
  root.appendChild(el('header',{},
    el('div',{}, el('h1',{},'Fishing Pool Probability Studio'), el('div',{class:'tag'},'Weighted fish-rarity probability modeling for proposals')),
    el('div',{class:'row'},
      el('button',{class:'ghost', onclick:()=>{state.presentation=!state.presentation; render();}}, state.presentation? 'Exit presentation mode':'Presentation mode'),
      el('button',{class:'ghost edit-only', onclick:toggleTheme}, 'Toggle theme')
    )
  ));

  // tabs
  const tabRow = el('div',{class:'tabs'});
  state.pools.forEach(p=>{
    tabRow.appendChild(el('div',{class:'tab'+(p.id===state.activePoolId?' active':''), onclick:()=>{state.activePoolId=p.id; state.selectedFishId=null; save(); render();}}, p.name));
  });
  tabRow.appendChild(el('button',{class:'iconbtn edit-only', onclick:()=>{ const n = prompt('New pool name:', 'New Pool'); if(n){ const p=newPool(n); state.pools.push(p); state.activePoolId=p.id; save(); render(); } }}, '+ New pool'));
  root.appendChild(tabRow);

  if(state.pools.length===0){
    root.appendChild(el('div',{class:'panel'}, 'No fishing pools exist. Create one to begin.'));
    return;
  }

  // pool actions
  root.appendChild(el('div',{class:'row edit-only', style:'margin-bottom:14px;'},
    el('button',{class:'ghost', onclick:()=>{ const n=prompt('Rename pool:', pool.name); if(n){pool.name=n; save(); render();} }}, 'Rename'),
    el('button',{class:'ghost', onclick:()=>{ const copy=JSON.parse(JSON.stringify(pool)); copy.id=uid('p'); copy.name=pool.name+' (copy)'; copy.fish.forEach(f=>f.id=f.id); state.pools.push(copy); state.activePoolId=copy.id; save(); render(); }}, 'Duplicate'),
    el('button',{class:'ghost danger', onclick:()=>{ if(state.pools.length<=1){alert('At least one pool must remain.'); return;} if(confirm('Delete pool "'+pool.name+'"? This cannot be undone.')){ state.pools = state.pools.filter(p=>p.id!==pool.id); state.activePoolId=state.pools[0].id; save(); render(); } }}, 'Delete pool'),
    el('button',{class:'ghost', onclick:()=>exportPoolCSV(pool)}, 'Export pool CSV'),
    el('button',{class:'ghost', onclick:()=>exportMatrixCSV(pool)}, 'Export matrix CSV'),
    el('button',{class:'ghost', onclick:()=>downloadCSV ? exportFullState() : null}, 'Export full state (JSON)'),
    el('button',{class:'ghost danger', onclick:()=>{ if(confirm('Reset modifiers to defaults? Fish data and rarity ranks are preserved.')){ pool.settings = defaultSettings(); save(); render(); } }}, 'Reset modifiers'),
    el('button',{class:'ghost danger', onclick:()=>{ if(confirm('Reset this pool to its original saved dataset? All edits will be lost.')){ const init=JSON.parse(JSON.stringify(pool.initial)); pool.fish=init.fish; pool.settings=init.settings; save(); render(); } }}, 'Reset pool'),
    el('button',{class:'ghost danger', onclick:()=>{ if(confirm('Reset ALL pools to their saved originals? All edits in every pool will be lost.')){ state.pools.forEach(p=>{ const init=JSON.parse(JSON.stringify(p.initial)); p.fish=init.fish; p.settings=init.settings; }); save(); render(); } }}, 'Reset all pools')
  ));

  const total = pool.fish.reduce((a,f)=>a+f.baseWeight,0);
  if(total<=0){
    root.appendChild(el('div',{class:'panel'}, el('strong',{},'No valid distribution: '), 'total base weight for "'+pool.name+'" is zero. Add fish or positive weights to see probabilities.'));
  }

  const topGrid = el('div',{class:'grid2'});
  topGrid.appendChild(renderFishTable(pool));
  topGrid.appendChild(renderComparisonPanel(pool));
  root.appendChild(topGrid);
  root.appendChild(renderMatrix(pool));
  if(state.selectedFishId) root.appendChild(renderDetail(pool));
  root.appendChild(el('footer',{}, 'Data is stored locally in this browser and will not sync between devices.'));
}

function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
}

// ---------- Fish table ----------
function renderFishTable(pool){
  const wrap = el('div',{class:'panel'});
  wrap.appendChild(el('h3',{},'Fish Data — '+pool.name));
  const tbl = el('table',{});
  tbl.appendChild(el('thead',{},el('tr',{},
    el('th',{title:'Persistent rarity rank, 1 = rarest. Drag a row by its handle to reorder; this never changes automatically when weights or probabilities change.'},'Rarity'),
    el('th',{title:'Fish display name, editable.'},'Name'),
    el('th',{title:'The original weight assigned to this fish. Editable; modifiers act on a calculated weight and never overwrite this value.'},'Base wt'),
    el('th',{title:'Base Weight \u00f7 sum of all base weights in this pool, with no modifiers applied.'},'Base prob'),
    el('th',{class:'edit-only', title:'Whether this fish can ever receive the Fishing Bait modifier. Pick the active bait/hook targets in the comparison panel.'},'Bait eligible'),
    el('th',{class:'edit-only'},'')
  )));
  const tb = el('tbody',{});
  const {map:baseMap, total} = baseProbs(pool);
  orderedFish(pool).forEach(f=>{
    const tr = el('tr',{
      class:f.id===state.selectedFishId?'selected-row':'',
      draggable:'true',
      ondragstart:(e)=>{ e.dataTransfer.setData('text/plain', f.id); e.dataTransfer.effectAllowed='move'; },
      ondragover:(e)=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; },
      ondrop:(e)=>{ e.preventDefault(); const draggedId=e.dataTransfer.getData('text/plain'); if(draggedId && draggedId!==f.id){ reorderFish(pool, draggedId, f.id); save(); render(); } },
      onclick:(e)=>{ if(e.target.tagName!=='INPUT' && e.target.tagName!=='SELECT'){ state.selectedFishId=f.id; render(); } }
    });
    const rankCell = el('td',{style:'text-align:left; cursor:grab;', title:'Drag to reorder rarity rank.'}, el('span',{style:'margin-right:6px;color:var(--muted)'},'⠿'), String(f.rarityRank));
    const nameInp = el('input',{type:'text',value:f.name,onchange:(e)=>{f.name=e.target.value; save(); render();}});
    const wtInp = el('input',{type:'number',value:f.baseWeight,min:0,step:'any',onchange:(e)=>{ let v=parseFloat(e.target.value); if(isNaN(v)||v<0){alert('Weight must be a non-negative number.'); render(); return;} f.baseWeight=v; save(); render();}});
    const baitChk = el('input',{type:'checkbox', checked:f.baitEligible, onchange:(e)=>{ f.baitEligible=e.target.checked; if(!f.baitEligible){ pool.settings.baitTargets = pool.settings.baitTargets.filter(id=>id!==f.id); } save(); render();}});
    const delBtn = el('button',{class:'iconbtn', onclick:(ev)=>{ev.stopPropagation(); if(confirm('Delete fish "'+f.name+'"?')){ pool.fish=pool.fish.filter(x=>x.id!==f.id); pool.settings.baitTargets=pool.settings.baitTargets.filter(id=>id!==f.id); if(pool.settings.hookTarget===f.id) pool.settings.hookTarget=null; normalizeRanks(pool); if(state.selectedFishId===f.id) state.selectedFishId=null; save(); render(); }}}, '✕');
    tr.appendChild(rankCell);
    tr.appendChild(el('td',{style:'text-align:left'}, nameInp));
    tr.appendChild(el('td',{}, wtInp));
    tr.appendChild(el('td',{}, pct(baseMap[f.id]||0)));
    tr.appendChild(el('td',{class:'edit-only'}, baitChk));
    tr.appendChild(el('td',{class:'edit-only'}, delBtn));
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  wrap.appendChild(tbl);
  wrap.appendChild(el('div',{class:'row edit-only', style:'margin-top:10px;'},
    el('button',{class:'ghost', onclick:()=>{ const newF={id:uid('f'), name:'New Fish', rarityRank:null, baseWeight:10, baitEligible:false}; pool.fish.push(newF); normalizeRanks(pool); save(); render(); }}, '+ Add fish'),
    el('label',{class:'small'}, 'Import CSV: '),
    el('input',{type:'file', accept:'.csv', onchange:(e)=>importCSV(e,pool)})
  ));
  wrap.appendChild(renderModifierSettings(pool));
  return wrap;
}

// ---------- Matrix ----------
function renderMatrix(pool){
  const wrap = el('div',{class:'panel'});
  wrap.appendChild(el('h3',{},'Probability Scenario Matrix'));
  const scen = allScenarios(pool);
  const {map:baseMap} = baseProbs(pool);
  const mwrap = el('div',{class:'matrixwrap'});
  const tbl = el('table',{});
  const grpRow = el('tr',{class:'grp-base'});
  grpRow.appendChild(el('th',{colspan:3},'Fish Data'));
  const grpRow2 = el('tr',{class:'grp-unboost'});
  grpRow2.appendChild(el('th',{colspan:4},'Unboosted Scenarios'));
  const grpRow3 = el('tr',{class:'grp-surge'});
  grpRow3.appendChild(el('th',{colspan:4},'Surge Scenarios'));
  const topHead = el('tr',{});
  [el('th',{colspan:3}), el('th',{colspan:4, class:'grp-unboost'}), el('th',{colspan:4,class:'grp-surge'})].forEach(()=>{});
  const head1 = el('tr',{},
    el('th',{class:'grp-base'},''), el('th',{class:'grp-base'},''), el('th',{class:'grp-base'},''),
    el('th',{class:'grp-unboost', colspan:4},'Unboosted scenarios'),
    el('th',{class:'grp-surge', colspan:4},'Surge scenarios')
  );
  const head2 = el('tr',{},
    el('th',{title:'Fish display name.'},'Name'), el('th',{title:'Original assigned weight. Never altered by modifiers.'},'Base wt'), el('th',{title:'Base Weight \u00f7 total base weight in this pool \u2014 the unmodified distribution.'},'Probability'),
    ...SCENARIOS.map(sc=>el('th',{class: sc.grp==='surge'?'grp-surge':'grp-unboost', title:sc.desc}, sc.label))
  );
  const thead = el('thead',{}, head1, head2);
  tbl.appendChild(thead);
  const tb = el('tbody',{});
  orderedFish(pool).forEach(f=>{
    const tr = el('tr',{class:f.id===state.selectedFishId?'selected-row':'', onclick:()=>{state.selectedFishId=f.id; render();}});
    tr.appendChild(el('td',{style:'text-align:left'}, f.name));
    tr.appendChild(el('td',{}, String(f.baseWeight)));
    tr.appendChild(el('td',{}, pct(baseMap[f.id]||0)));
    SCENARIOS.forEach(sc=>{
      const r = scen[sc.key].rows.find(row=>row.fish.id===f.id);
      const statuses = [r.baitStatus, r.hookStatus].filter(Boolean);
      let content;
      if(statuses.length){
        content = el('span',{}, pct(r.prob), ' ', el('span',{class:'status'}, '('+statuses.join(' / ')+')'));
      } else {
        content = pct(r.prob);
      }
      tr.appendChild(el('td',{class: sc.grp==='surge'?'cell-surge':'cell-unboost'}, content));
    });
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  mwrap.appendChild(tbl);
  wrap.appendChild(mwrap);
  wrap.appendChild(el('div',{class:'legend'},
    el('span',{}, el('span',{class:'swatch',style:'background:var(--unboost-bg)'}), 'Unboosted scenarios'),
    el('span',{}, el('span',{class:'swatch',style:'background:var(--surge-bg)'}), 'Surge scenarios'),
    el('span',{}, el('span',{class:'swatch',style:'background:var(--accent2)'}), 'Selected fish outline'),
    el('span',{}, '"No Bait"/"No Hook" = fish ineligible or not the active target; its other probabilities are still calculated normally.')
  ));
  return wrap;
}

// ---------- Settings + Charts ----------
function renderModifierSettings(pool){
  const s = pool.settings;
  const wrap = el('div',{class:'edit-only', style:'margin-top:18px;padding-top:14px;border-top:1px solid var(--line);'});
  wrap.appendChild(el('h3',{},'Modifier Settings'));
  const surgeMultRow = el('div',{class:'row', style:'margin-top:4px'});
  if(s.surgeMults.length===0){ surgeMultRow.appendChild(el('span',{class:'small'}, 'No rank multipliers set \u2014 every rank uses 1\u00d7.')); }
  s.surgeMults.forEach((m,i)=>{
    surgeMultRow.appendChild(el('label',{class:'small', style:'display:inline-flex;align-items:center;gap:4px'},
      'Rank '+(i+1)+': ',
      el('input',{type:'number',value:m,min:0,step:'any',onchange:(e)=>{ let v=parseFloat(e.target.value); if(isNaN(v)||v<0){alert('Multiplier must be a non-negative number.'); render(); return;} s.surgeMults[i]=v; save(); render();}}),
      el('button',{class:'iconbtn', title:'Remove this rank multiplier', onclick:()=>{ s.surgeMults.splice(i,1); save(); render(); }}, '\u2715')
    ));
  });
  surgeMultRow.appendChild(el('button',{class:'iconbtn', onclick:()=>{ s.surgeMults.push(1); save(); render(); }}, '+ Add rank'));
  wrap.appendChild(el('div',{style:'margin-bottom:10px'},
    el('label',{}, el('input',{type:'checkbox', checked:s.surgeEnabled, onchange:(e)=>{s.surgeEnabled=e.target.checked; save(); render();}}), ' Fishing Surge enabled'),
    surgeMultRow,
    el('div',{class:'small', style:'margin-top:4px'}, 'Ranks beyond the highest listed rank always use a 1\u00d7 multiplier.')
  ));
  wrap.appendChild(el('div',{style:'margin-bottom:10px'},
    el('label',{}, el('input',{type:'checkbox', checked:s.baitEnabled, onchange:(e)=>{s.baitEnabled=e.target.checked; save(); render();}}), ' Fishing Bait enabled'),
    el('div',{class:'row', style:'margin-top:4px'},
      el('label',{class:'small'}, 'Multiplier: ', el('input',{type:'number',value:s.baitMult,min:0,step:'any',onchange:(e)=>{s.baitMult=parseFloat(e.target.value)||0; save(); render();}})),
      el('label',{class:'small'}, 'Max targets: ', el('select',{onchange:(e)=>{ const v=parseInt(e.target.value); s.maxBaitTargets=v; if(s.baitTargets.length>v) s.baitTargets=s.baitTargets.slice(0,v); save(); render();}}, el('option',{value:1, selected:s.maxBaitTargets===1},'1'), el('option',{value:2, selected:s.maxBaitTargets===2},'2')))
    )
  ));
  wrap.appendChild(el('div',{},
    el('label',{}, el('input',{type:'checkbox', checked:s.hookEnabled, onchange:(e)=>{s.hookEnabled=e.target.checked; save(); render();}}), ' Fishing Hook enabled'),
    el('div',{class:'row', style:'margin-top:4px'}, el('label',{class:'small'}, 'Multiplier: ', el('input',{type:'number',value:s.hookMult,min:0,step:'any',onchange:(e)=>{s.hookMult=parseFloat(e.target.value)||0; save(); render();}})))
  ));
  return wrap;
}

function renderComparisonPanel(pool){
  const s = pool.settings;
  const wrap = el('div',{class:'panel'});
  wrap.appendChild(el('h3',{},'Base vs. Scenario Comparison'));
  const modeSel = el('select',{onchange:(e)=>{state.chartMode=e.target.value; save(); render();}},
    el('option',{value:'side', selected:(state.chartMode||'side')==='side'},'Side by side'),
    el('option',{value:'overlap', selected:state.chartMode==='overlap'},'Overlapping'));
  const baselineRow = el('div',{class:'row', style:'margin-bottom:6px'},
    el('span',{class:'small'},'Baseline: '),
    el('div',{class:'tab'+(!state.chartSurge?' active':''), onclick:()=>{state.chartSurge=false; save(); render();}}, 'Unboosted'),
    el('div',{class:'tab'+(state.chartSurge?' active':''), onclick:()=>{state.chartSurge=true; save(); render();}}, 'Surge Boost'),
    el('span',{class:'small', style:'margin-left:12px'},'Layout: '), modeSel
  );
  wrap.appendChild(baselineRow);

  const activeKey = activeScenarioKey(pool);
  const activeLabel = SCENARIOS.find(sc=>sc.key===activeKey).label;
  wrap.appendChild(el('div',{class:'small', style:'margin-bottom:8px;color:var(--muted)'}, 'Showing: '+activeLabel+' \u2014 toggle the baseline and targets below to change it.'));

  const eligible = pool.fish.filter(f=>f.baitEligible);
  const baitRow = el('div',{class:'row', style:'margin-bottom:6px'}, el('span',{class:'small'}, 'Bait target'+(s.maxBaitTargets>1?'s':'')+(s.baitEnabled?'':' (disabled)')+': '));
  if(eligible.length===0){ baitRow.appendChild(el('span',{class:'small'},'No bait-eligible fish yet \u2014 mark some eligible in the Fish Data table.')); }
  eligible.forEach(f=>{
    baitRow.appendChild(el('label',{class:'small', style:'margin-right:10px'},
      el('input',{type:'checkbox', disabled: !s.baitEnabled, checked: s.baitTargets.includes(f.id), onchange:(e)=>{
        if(e.target.checked){
          if(s.baitTargets.length>=s.maxBaitTargets){ alert('Maximum of '+s.maxBaitTargets+' bait target(s) allowed.'); e.target.checked=false; return; }
          s.baitTargets.push(f.id);
        } else { s.baitTargets = s.baitTargets.filter(id=>id!==f.id); }
        save(); render();
      }}), ' '+f.name));
  });
  wrap.appendChild(baitRow);

  const hookRow = el('div',{class:'row', style:'margin-bottom:10px'}, el('span',{class:'small'}, 'Hook target'+(s.hookEnabled?'':' (disabled)')+': '));
  if(pool.fish.length===0){ hookRow.appendChild(el('span',{class:'small'},'No fish yet.')); }
  pool.fish.forEach(f=>{
    hookRow.appendChild(el('label',{class:'small', style:'margin-right:10px'},
      el('input',{type:'checkbox', disabled: !s.hookEnabled, checked: s.hookTarget===f.id, onchange:(e)=>{
        if(e.target.checked){ s.hookTarget = f.id; } else if(s.hookTarget===f.id){ s.hookTarget = null; }
        save(); render();
      }}), ' '+f.name));
  });
  wrap.appendChild(hookRow);

  wrap.appendChild(el('div',{class:'legend', style:'margin-bottom:6px'},
    el('span',{}, el('span',{class:'swatch',style:'background:var(--unboost)'}), 'Base'),
    el('span',{}, el('span',{class:'swatch',style:'background:var(--accent2)'}), 'Scenario')
  ));
  const scen = allScenarios(pool);
  const {map:baseMap} = baseProbs(pool);
  const fishOrdered = orderedFish(pool);
  const maxP = Math.max(0.0001, ...fishOrdered.map(f=>Math.max(baseMap[f.id]||0, scen[activeKey].rows.find(r=>r.fish.id===f.id).prob)));
  const mode = state.chartMode||'side';
  fishOrdered.forEach(f=>{
    const bp = baseMap[f.id]||0;
    const sp = scen[activeKey].rows.find(r=>r.fish.id===f.id).prob;
    if(mode==='overlap'){
      wrap.appendChild(el('div',{class:'bar-row'},
        el('div',{class:'bar-label'}, f.name),
        el('div',{class:'bar-track', style:'position:relative;height:18px;'},
          el('div',{class:'bar-fill', style:`position:absolute;left:0;top:0;height:100%;width:${(bp/maxP*100).toFixed(1)}%;background:var(--unboost);opacity:.85`}),
          el('div',{class:'bar-fill', style:`position:absolute;left:0;top:4px;height:10px;width:${(sp/maxP*100).toFixed(1)}%;background:var(--accent2);opacity:.9;border-radius:3px`})
        ),
        el('span',{class:'small'}, pct(bp)+' / '+pct(sp))
      ));
    } else {
      wrap.appendChild(el('div',{},
        el('div',{class:'bar-row'}, el('div',{class:'bar-label'}, f.name+' (base)'), el('div',{class:'bar-track'}, el('div',{class:'bar-fill', style:`width:${(bp/maxP*100).toFixed(1)}%;background:var(--unboost)`})), el('span',{class:'small'}, pct(bp))),
        el('div',{class:'bar-row'}, el('div',{class:'bar-label'}, f.name+' (scenario)'), el('div',{class:'bar-track'}, el('div',{class:'bar-fill', style:`width:${(sp/maxP*100).toFixed(1)}%;background:var(--accent2)`})), el('span',{class:'small'}, pct(sp)))
      ));
    }
  });

  wrap.appendChild(el('h3',{style:'margin-top:18px'},'Probability Change (percentage points)'));
  const maxDiff = Math.max(0.0001, ...fishOrdered.map(f=>Math.abs(scen[activeKey].rows.find(r=>r.fish.id===f.id).prob - (baseMap[f.id]||0))));
  fishOrdered.forEach(f=>{
    const bp=baseMap[f.id]||0, sp=scen[activeKey].rows.find(r=>r.fish.id===f.id).prob;
    const diff = sp-bp;
    const pctWidth = Math.abs(diff)/maxDiff*50;
    wrap.appendChild(el('div',{class:'bar-row'},
      el('div',{class:'bar-label'}, f.name),
      el('div',{class:'diverge-track'},
        el('div',{class:'diverge-zero'}),
        el('div',{class:'diverge-fill', style:`background:${diff>=0?'var(--accent)':'var(--bad)'}; width:${pctWidth}%; left:${diff>=0?'50%':(50-pctWidth)+'%'}`})
      ),
      el('span',{class:'small'}, (diff>=0?'+':'')+(diff*100).toFixed(2)+' pp')
    ));
  });

  return wrap;
}

// ---------- Detail panel ----------
function renderDetail(pool){
  const f = pool.fish.find(x=>x.id===state.selectedFishId);
  if(!f) return el('div',{});
  const wrap = el('div',{class:'panel detail'});
  const scen = allScenarios(pool);
  const {map:baseMap} = baseProbs(pool);
  const r = scen[activeScenarioKey(pool)].rows.find(row=>row.fish.id===f.id);
  wrap.appendChild(el('h3',{}, 'Fish Detail — '+f.name));
  wrap.appendChild(el('dl',{},
    el('dt',{},'Rarity rank'), el('dd',{},String(f.rarityRank)),
    el('dt',{},'Base weight'), el('dd',{},String(f.baseWeight)),
    el('dt',{},'Base probability'), el('dd',{}, pct(baseMap[f.id]||0)),
    el('dt',{},'Surge multiplier'), el('dd',{}, String(surgeMultFor(f,pool.settings))+'×'),
    el('dt',{},'Bait eligible'), el('dd',{}, f.baitEligible?'Yes':'No'),
    el('dt',{},'Active bait target'), el('dd',{}, pool.settings.baitTargets.includes(f.id)?'Yes':'No'),
    el('dt',{},'Active hook target'), el('dd',{}, pool.settings.hookTarget===f.id?'Yes':'No'),
    el('dt',{},'Scenario ('+SCENARIOS.find(s=>s.key===activeScenarioKey(pool)).label+')'), el('dd',{}),
    el('dt',{},'Combined multiplier'), el('dd',{}, (r.sMult*r.bMult*r.hMult).toFixed(3)+'×'),
    el('dt',{},'Modified weight'), el('dd',{}, r.modWeight.toFixed(3)),
    el('dt',{},'Final probability'), el('dd',{}, pct(r.prob)),
    el('dt',{},'Probability change'), el('dd',{}, ((r.prob-(baseMap[f.id]||0))*100>=0?'+':'')+((r.prob-(baseMap[f.id]||0))*100).toFixed(2)+' pp')
  ));
  return wrap;
}

// ---------- CSV ----------
function exportFullState(){
  const data = JSON.stringify({pools:state.pools}, null, 2);
  const blob = new Blob([data],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download='fishing_app_full_state.json'; a.click();
}
function csvEscape(v){ v=String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download=filename; a.click();
}
function exportPoolCSV(pool){
  const {map:baseMap} = baseProbs(pool);
  const rows=[['Name','RarityRank','BaseWeight','BaseProbability','BaitEligible']];
  orderedFish(pool).forEach(f=> rows.push([f.name, f.rarityRank, f.baseWeight, (baseMap[f.id]*100).toFixed(2)+'%', f.baitEligible]));
  downloadCSV(pool.name.replace(/\s+/g,'_')+'_pool.csv', rows);
}
function exportMatrixCSV(pool){
  const scen = allScenarios(pool);
  const {map:baseMap} = baseProbs(pool);
  const rows=[['Name','RarityRank','BaseWeight','Probability', ...SCENARIOS.map(s=>s.label)]];
  orderedFish(pool).forEach(f=>{
    const row=[f.name, f.rarityRank, f.baseWeight, (baseMap[f.id]*100).toFixed(2)+'%'];
    SCENARIOS.forEach(sc=>{ const r=scen[sc.key].rows.find(x=>x.fish.id===f.id); row.push((r.prob*100).toFixed(2)+'%'); });
    rows.push(row);
  });
  downloadCSV(pool.name.replace(/\s+/g,'_')+'_matrix.csv', rows);
}
function importCSV(e, pool){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const lines = ev.target.result.split(/\r?\n/).filter(l=>l.trim().length);
      if(lines.length<2){ alert('CSV must have a header row and at least one data row.'); return; }
      const header = lines[0].split(',').map(h=>h.trim().toLowerCase());
      const nameIdx=header.indexOf('name')>=0?header.indexOf('name'):header.indexOf('fish name');
      const wtIdx = header.indexOf('baseweight')>=0?header.indexOf('baseweight'):header.indexOf('base weight');
      const rankIdx = header.indexOf('rarityrank')>=0?header.indexOf('rarityrank'):header.indexOf('rarity rank');
      const baitIdx = header.indexOf('baiteligible')>=0?header.indexOf('baiteligible'):header.indexOf('bait eligible');
      if(nameIdx<0 || wtIdx<0){ alert('CSV must include at least Name and Base Weight columns.'); return; }
      const added=[]; const errors=[];
      let nextRank = Math.max(0,...pool.fish.map(f=>f.rarityRank||0))+1;
      lines.slice(1).forEach((line,i)=>{
        const cols = line.split(',').map(c=>c.trim());
        const name = cols[nameIdx];
        const wt = parseFloat(cols[wtIdx]);
        if(!name){ errors.push('Row '+(i+2)+': missing fish name.'); return; }
        if(isNaN(wt) || wt<0){ errors.push('Row '+(i+2)+': invalid weight.'); return; }
        let rank = rankIdx>=0 && cols[rankIdx] ? parseInt(cols[rankIdx]) : nextRank++;
        if(isNaN(rank)||rank<1){ errors.push('Row '+(i+2)+': invalid rarity rank, placed at end.'); rank=nextRank++; }
        const bait = baitIdx>=0 ? /^(true|yes|1)$/i.test(cols[baitIdx]||'') : false;
        added.push({id:uid('f'), name, baseWeight:wt, rarityRank:rank, baitEligible:bait});
      });
      pool.fish.push(...added);
      normalizeRanks(pool);
      save(); render();
      if(errors.length) alert('Imported '+added.length+' fish with some issues:\n'+errors.join('\n'));
      else alert('Imported '+added.length+' fish successfully.');
    }catch(err){ alert('Could not parse this CSV file.'); }
  };
  reader.readAsText(file);
  e.target.value='';
}

render();
})();
